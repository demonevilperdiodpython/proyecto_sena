{% extends 'plantilla.html' %}

{% block title %}Editar Sección{% endblock %}

{% load static %}

{% block css %}
<link rel="stylesheet" type="text/css" href="{% static 'catalog/css/add_group.css' %}">
{% endblock %}

{% block content %}
<div class="addgroup">
    <div class="groupz">
        <h2>Editar Sección</h2>

        <p style="font-size:0.9rem; text-align:center; color:var(--font-primary-black-light);">
            En el grupo <strong>{{ group.nombre }}</strong>
        </p>

        {% if error %}
            <div class="form-error-box">
                <p class="error-msg">⚠️ {{ error }}</p>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="field-container">
                <label>Nombre de la sección</label>
                <input type="text" name="name" value="{{ nombre }}" maxlength="100" required>
            </div>
            <button type="submit" class="boton-registrar">Guardar</button>
        </form>

        <a href="{% url 'catalog:topic_section' group.id section.id %}" class="btn-publish" style="display:block; text-align:center; background:transparent; border:1px solid var(--primary-color); margin-top:0.5rem;">
            Volver
        </a>
    </div>
</div>
{% endblock %}
