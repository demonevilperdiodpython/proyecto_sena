{%extends 'plantilla.html'%}

{% load static %}    
{% block title %}AÑADE UN GRUPO{% endblock %}


{%block css%}
    <link rel="stylesheet" type="text/css" href="{% static 'catalog/css/add_group.css'%}">   

	<link rel="stylesheet" type="text/css" href="{% static 'css/styles.css'%}">


{%endblock%}



{%block content%}
<div class="addgroup">
    <div class="groupz">
        <form method = "POST" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="boton-registrar">Registrar</button>
        </form>
    </div>
<div>
{% endblock %}
