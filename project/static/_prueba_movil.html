<!DOCTYPE html>
<!-- Auxiliar SOLO para probar el diseno en tamano de celular/tablet. Se borra al terminar. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba movil</title>
  <style>html,body{margin:0;padding:0;background:#333}iframe{border:0;display:block}</style>
</head>
<body>
  <iframe id="marco" title="app"></iframe>
  <script>
    const p = new URLSearchParams(location.search);
    const marco = document.getElementById("marco");
    marco.style.width = (p.get("w") || "390") + "px";
    marco.style.height = (p.get("h") || "844") + "px";
    window.__r = {};
    function auditar() {
      const d = marco.contentDocument; if (!d) return;
      const m = Date.now();
      for (const l of d.querySelectorAll('link[rel="stylesheet"]')) l.href = l.href.split("?")[0] + "?cb=" + m;
      setTimeout(function () {
        const s = d.createElement("script"); s.src = "/static/_auditar_movil.js";
        d.body.appendChild(s);
        setTimeout(function () {
          const a = marco.contentWindow.__auditoria || {};
          window.__r.url = location.search;
          window.__r.a = a;
          window.__listo = true;
        }, 900);
      }, 900);
    }
    marco.addEventListener("load", auditar);
    marco.src = p.get("u") || "/";
  </script>
</body>
</html>
